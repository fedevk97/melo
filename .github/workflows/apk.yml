name: APK

on:
  push:
    branches: [claude/melo-android-auto-version-d0m54h]
    paths-ignore: ["docs/**", "protocol/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: melo-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # The unit tests run after the APK is saved, so a failing test never withholds it.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
